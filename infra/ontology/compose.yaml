name: tradelens-ontology
services:
  ontop:
    image: tradelens-ontop:5.5.0
    build:
      context: ../..
      dockerfile: infra/ontology/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/tradelens.ttl
      ONTOP_FACTS_FILE: /opt/ontop/input/facts.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/tradelens.r2rml.ttl
      ONTOP_LENSES_FILE: /opt/ontop/input/lenses.json
      ONTOP_DB_URL: ${ONTOP_DB_URL:?Run python -m chat.cli configure first}
      ONTOP_DB_USER: ${ONTOP_DB_USER:?Run python -m chat.cli configure first}
      ONTOP_DB_PASSWORD: ${ONTOP_DB_PASSWORD:?Run python -m chat.cli configure first}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_DEV_MODE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
